# Setup config. It decides which sections of continue_config.yml run, then
# continues the pipeline with that file.
#
# CircleCI starts this pipeline for non-draft pull requests and tag pushes.
# Pushes to main do not start a pipeline.

version: 2.1

setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  # Compare the pull request with its target branch (not always main, because
  # pull requests can be stacked) and start only the affected sections.
  pull-request:
    when: pipeline.event.name == "pull_request" and pipeline.event.github.pull_request.draft == false
    jobs:
      - path-filtering/filter:
          name: filter-paths
          # Guarded so that tag pipelines, which have no pull request values,
          # never read them.
          base-revision: << pipeline.event.name == "pull_request" and pipeline.event.github.pull_request.base.ref or "main" >>
          config-path: .circleci/continue_config.yml
          # <regex> <parameter> <value>, one per line. The orb anchors each
          # regex (^...$) and matches it against every changed path with
          # grep -P. Changes under .circleci/ start every section.
          mapping: |
            (apps/legacy|\.circleci)/.* run-legacy true
            (apps/desktop/(?!src-tauri/)|\.circleci/).* run-desktop-frontend true
            ((apps/desktop/src-tauri|crates|\.circleci)/.*|Cargo\.(toml|lock)) run-desktop-rust true
            (apps/docs|\.circleci)/.* run-docs true

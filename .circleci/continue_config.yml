# Continuation config. config.yml sets the parameters below and continues the
# pipeline with this file.
#
# Each section owns one block under parameters, jobs, and workflows, in this
# order. Change only your own section's blocks, so that pull requests for
# different sections do not conflict. The placeholder job stands in until a
# section has its own jobs. When no parameter is true, no workflow runs.

version: 2.1

parameters:
  # --- legacy (apps/legacy) ---
  run-legacy:
    type: boolean
    default: false

  # --- desktop front end (apps/desktop, except src-tauri) ---
  run-desktop-frontend:
    type: boolean
    default: false

  # --- desktop Rust (apps/desktop/src-tauri, crates, Cargo.toml, Cargo.lock) ---
  run-desktop-rust:
    type: boolean
    default: false

  # --- docs (apps/docs) ---
  run-docs:
    type: boolean
    default: false

  # --- desktop release (desktop-v* tags) ---
  run-desktop-release:
    type: boolean
    default: false

  # --- legacy release (legacy-v* tags) ---
  run-legacy-release:
    type: boolean
    default: false

  # --- docs release (docs-v* tags) ---
  run-docs-release:
    type: boolean
    default: false

jobs:
  # --- shared ---
  placeholder:
    parameters:
      section:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "No << parameters.section >> checks yet."

  # --- legacy ---
  legacy-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - legacy-pip-v1-{{ checksum "apps/legacy/Code/Module_Main_1_3/Application/requirements.txt" }}-{{ checksum "apps/legacy/requirements-dev.txt" }}
            - legacy-pip-v1-
      - run:
          name: Install dependencies
          working_directory: apps/legacy
          command: |
            python -m venv ~/venv
            ~/venv/bin/pip install -r Code/Module_Main_1_3/Application/requirements.txt -r requirements-dev.txt
      - save_cache:
          key: legacy-pip-v1-{{ checksum "apps/legacy/Code/Module_Main_1_3/Application/requirements.txt" }}-{{ checksum "apps/legacy/requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check formatting
          working_directory: apps/legacy
          command: ~/venv/bin/ruff format --check .
      # Run the remaining checks even if an earlier one fails, so that one
      # pipeline reports every problem.
      - run:
          name: Lint
          working_directory: apps/legacy
          command: ~/venv/bin/ruff check .
          when: always
      - run:
          name: Test
          working_directory: apps/legacy
          command: ~/venv/bin/pytest --junitxml=test-results/junit.xml
          environment:
            QT_QPA_PLATFORM: offscreen
          when: always
      - store_test_results:
          path: apps/legacy/test-results

  # --- desktop front end ---

  # --- desktop Rust ---

  # --- docs ---

  # --- desktop release ---

  # --- legacy release ---
  # Release builds start from a clean checkout without caches, on the same
  # Python version as the legacy checks (cimg/python:3.12).
  legacy-release-windows:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: bash.exe -eo pipefail
    steps:
      - run:
          name: Check the tag
          command: |
            if [[ ! $CIRCLE_TAG =~ ^legacy-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Use a tag like legacy-v0.2.0 or legacy-v0.2.0-rc.1, not ${CIRCLE_TAG}."
              exit 1
            fi
      - checkout
      - run:
          name: Install Python and the build tools
          working_directory: apps/legacy
          command: |
            powershell.exe -ExecutionPolicy Bypass -c "irm https://astral.sh/uv/0.13.6/install.ps1 | iex"
            export PATH="$HOME/.local/bin:$PATH"
            uv venv --python 3.12 .venv
            uv pip install -r Code/Module_Main_1_3/Application/requirements.txt -r requirements-build.txt
      - run:
          name: Build the executables
          working_directory: apps/legacy
          command: |
            export PATH="$PWD/.venv/Scripts:$PATH"
            ./build.bat
      # Nobody on the team has Windows, so start each executable here. A
      # one-file executable unpacks itself and starts a second process with
      # the same name, which opens the window. Wait for the app's window
      # (title LabView): if the app crashes, PyInstaller shows an error dialog
      # instead, and the process keeps running.
      - run:
          name: Start each executable
          working_directory: apps/legacy/dist
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            foreach ($name in 'LabView_module_1', 'LabView_module_2') {
              $app = Start-Process -FilePath "$name.exe" -PassThru
              $deadline = (Get-Date).AddSeconds(90)
              do {
                Start-Sleep -Seconds 2
                if ($app.HasExited) { throw "$name.exe exited with code $($app.ExitCode)." }
                $window = Get-Process -Name $name | Where-Object MainWindowTitle -eq 'LabView'
              } until ($window -or (Get-Date) -gt $deadline)
              if (-not $window) {
                $titles = (Get-Process -Name $name).MainWindowTitle -join "', '"
                throw "$name.exe opened no LabView window within 90 seconds. Window titles: '$titles'."
              }
              Start-Sleep -Seconds 10
              if ($app.HasExited) { throw "$name.exe exited with code $($app.ExitCode) after opening its window." }
              Write-Host "$name.exe is running with its LabView window open (process $($window.Id))."
              Get-Process -Name $name | Stop-Process -Force
            }
            Get-ChildItem *.exe | Format-Table Name, Length
      - persist_to_workspace:
          root: apps/legacy/dist
          paths:
            - LabView_module_1.exe
            - LabView_module_2.exe

  legacy-release-publish:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: executables
      - run:
          name: Install the GitHub CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gh
      # GITHUB_TOKEN comes from the github-releases context, and gh reads it
      # from the environment. If the release exists (a re-run), update it and
      # replace its files instead of failing.
      - run:
          name: Publish the GitHub release
          command: |
            : "${GITHUB_TOKEN:?Add the github-releases context to this job.}"
            export GH_REPO=ddelvalfraire/cousins-lab-tools
            prerelease=false
            if [[ $CIRCLE_TAG =~ -rc\.[0-9]+$ ]]; then
              prerelease=true
            fi
            files=(executables/LabView_module_1.exe executables/LabView_module_2.exe)
            if gh release view "$CIRCLE_TAG" > /dev/null 2>&1; then
              gh release edit "$CIRCLE_TAG" --prerelease="$prerelease"
              gh release upload "$CIRCLE_TAG" "${files[@]}" --clobber
            else
              gh release create "$CIRCLE_TAG" "${files[@]}" --verify-tag \
                --prerelease="$prerelease" \
                --title "Modules 1 and 2 ${CIRCLE_TAG#legacy-v}" \
                --notes "Windows executables for Modules 1 and 2, built from ${CIRCLE_SHA1}.

            - Module 1: \`LabView_module_1.exe\`
            - Module 2: \`LabView_module_2.exe\`

            Download the file and run it. There is nothing to install. The executables are not code signed, so Windows SmartScreen warns before the first launch."
            fi
            gh release view "$CIRCLE_TAG" --json url,isPrerelease,assets \
              --jq '"\(.url) prerelease=\(.isPrerelease)", (.assets[] | "  \(.name)")'

  # --- docs release ---

workflows:
  # --- legacy ---
  legacy:
    when: << pipeline.parameters.run-legacy >>
    jobs:
      - legacy-checks

  # --- desktop front end ---
  desktop-frontend:
    when: << pipeline.parameters.run-desktop-frontend >>
    jobs:
      - placeholder:
          name: desktop-frontend-placeholder
          section: desktop front-end

  # --- desktop Rust ---
  desktop-rust:
    when: << pipeline.parameters.run-desktop-rust >>
    jobs:
      - placeholder:
          name: desktop-rust-placeholder
          section: desktop Rust

  # --- docs ---
  docs:
    when: << pipeline.parameters.run-docs >>
    jobs:
      - placeholder:
          name: docs-placeholder
          section: docs

  # --- desktop release ---
  desktop-release:
    when: << pipeline.parameters.run-desktop-release >>
    jobs:
      - placeholder:
          name: desktop-release-placeholder
          section: desktop release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^desktop-v.*/

  # --- legacy release ---
  legacy-release:
    when: << pipeline.parameters.run-legacy-release >>
    jobs:
      - legacy-release-windows:
          filters: &legacy-release-tags
            branches:
              ignore: /.*/
            tags:
              only: /^legacy-v.*/
      - legacy-release-publish:
          context: github-releases
          requires:
            - legacy-release-windows
          filters: *legacy-release-tags

  # --- docs release ---
  docs-release:
    when: << pipeline.parameters.run-docs-release >>
    jobs:
      - placeholder:
          name: docs-release-placeholder
          section: docs release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^docs-v.*/

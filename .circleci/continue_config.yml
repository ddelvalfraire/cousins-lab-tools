# Continuation config. config.yml sets the parameters below and continues the
# pipeline with this file.
#
# Each section owns one block under parameters, jobs, and workflows, in this
# order. Change only your own section's blocks, so that pull requests for
# different sections do not conflict. The placeholder job stands in until a
# section has its own jobs. When no parameter is true, no workflow runs.

version: 2.1

parameters:
  # --- legacy (apps/legacy) ---
  run-legacy:
    type: boolean
    default: false

  # --- desktop front end (apps/desktop, except src-tauri) ---
  run-desktop-frontend:
    type: boolean
    default: false

  # --- desktop Rust (apps/desktop/src-tauri, crates, Cargo.toml, Cargo.lock) ---
  run-desktop-rust:
    type: boolean
    default: false

  # --- docs (apps/docs) ---
  run-docs:
    type: boolean
    default: false

  # --- desktop release (desktop-v* tags) ---
  run-desktop-release:
    type: boolean
    default: false

  # --- legacy release (legacy-v* tags) ---
  run-legacy-release:
    type: boolean
    default: false

  # --- docs release (docs-v* tags) ---
  run-docs-release:
    type: boolean
    default: false

jobs:
  # --- shared ---
  placeholder:
    parameters:
      section:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "No << parameters.section >> checks yet."

  # --- legacy ---
  legacy-checks:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - legacy-pip-v1-{{ checksum "apps/legacy/Code/Module_Main_1_3/Application/requirements.txt" }}-{{ checksum "apps/legacy/requirements-dev.txt" }}
            - legacy-pip-v1-
      - run:
          name: Install dependencies
          working_directory: apps/legacy
          command: |
            python -m venv ~/venv
            ~/venv/bin/pip install -r Code/Module_Main_1_3/Application/requirements.txt -r requirements-dev.txt
      - save_cache:
          key: legacy-pip-v1-{{ checksum "apps/legacy/Code/Module_Main_1_3/Application/requirements.txt" }}-{{ checksum "apps/legacy/requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check formatting
          working_directory: apps/legacy
          command: ~/venv/bin/ruff format --check .
      # Run the remaining checks even if an earlier one fails, so that one
      # pipeline reports every problem.
      - run:
          name: Lint
          working_directory: apps/legacy
          command: ~/venv/bin/ruff check .
          when: always
      - run:
          name: Test
          working_directory: apps/legacy
          command: ~/venv/bin/pytest --junitxml=test-results/junit.xml
          environment:
            QT_QPA_PLATFORM: offscreen
          when: always
      - store_test_results:
          path: apps/legacy/test-results

  # --- desktop front end ---

  # --- desktop Rust ---

  # --- docs ---

  # --- desktop release ---

  # --- legacy release ---

  # --- docs release ---

workflows:
  # --- legacy ---
  legacy:
    when: << pipeline.parameters.run-legacy >>
    jobs:
      - legacy-checks

  # --- desktop front end ---
  desktop-frontend:
    when: << pipeline.parameters.run-desktop-frontend >>
    jobs:
      - placeholder:
          name: desktop-frontend-placeholder
          section: desktop front-end

  # --- desktop Rust ---
  desktop-rust:
    when: << pipeline.parameters.run-desktop-rust >>
    jobs:
      - placeholder:
          name: desktop-rust-placeholder
          section: desktop Rust

  # --- docs ---
  docs:
    when: << pipeline.parameters.run-docs >>
    jobs:
      - placeholder:
          name: docs-placeholder
          section: docs

  # --- desktop release ---
  desktop-release:
    when: << pipeline.parameters.run-desktop-release >>
    jobs:
      - placeholder:
          name: desktop-release-placeholder
          section: desktop release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^desktop-v.*/

  # --- legacy release ---
  legacy-release:
    when: << pipeline.parameters.run-legacy-release >>
    jobs:
      - placeholder:
          name: legacy-release-placeholder
          section: legacy release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^legacy-v.*/

  # --- docs release ---
  docs-release:
    when: << pipeline.parameters.run-docs-release >>
    jobs:
      - placeholder:
          name: docs-release-placeholder
          section: docs release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^docs-v.*/

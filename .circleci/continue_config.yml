# Continuation config. config.yml sets the parameters below and continues the
# pipeline with this file.
#
# Each section owns one block under parameters, jobs, and workflows, in this
# order. Change only your own section's blocks, so that pull requests for
# different sections do not conflict. The placeholder job stands in until a
# section has its own jobs. When no parameter is true, no workflow runs.

version: 2.1

parameters:
  # --- legacy (apps/legacy) ---
  run-legacy:
    type: boolean
    default: false

  # --- desktop front end (apps/desktop, except src-tauri) ---
  run-desktop-frontend:
    type: boolean
    default: false

  # --- desktop Rust (apps/desktop/src-tauri, crates, Cargo.toml, Cargo.lock) ---
  run-desktop-rust:
    type: boolean
    default: false

  # --- docs (apps/docs) ---
  run-docs:
    type: boolean
    default: false

  # --- desktop release (desktop-v* tags) ---
  run-desktop-release:
    type: boolean
    default: false

  # --- legacy release (legacy-v* tags) ---
  run-legacy-release:
    type: boolean
    default: false

  # --- docs release (docs-v* tags) ---
  run-docs-release:
    type: boolean
    default: false

jobs:
  # --- shared ---
  placeholder:
    parameters:
      section:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "No << parameters.section >> checks yet."

  # --- legacy ---

  # --- desktop front end ---

  # --- desktop Rust ---

  # --- docs ---
  docs-build:
    docker:
      # Matches apps/docs/.nvmrc.
      - image: cimg/node:26.12.1
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Bun from packageManager
          working_directory: apps/docs
          command: |
            npm install --global --prefix "$HOME/.local" "$(node -p 'require("./package.json").packageManager')"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - docs-bun-v1-{{ arch }}-{{ checksum "apps/docs/bun.lock" }}
            - docs-bun-v1-{{ arch }}-
      - run:
          name: Install dependencies
          working_directory: apps/docs
          command: bun install --frozen-lockfile
      - save_cache:
          key: docs-bun-v1-{{ arch }}-{{ checksum "apps/docs/bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - run:
          name: Build the site
          working_directory: apps/docs
          command: bun run build

  # --- desktop release ---

  # --- legacy release ---

  # --- docs release ---
  docs-publish:
    docker:
      # Matches apps/docs/.nvmrc.
      - image: cimg/node:26.12.1
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install Bun from packageManager
          working_directory: apps/docs
          command: |
            npm install --global --prefix "$HOME/.local" "$(node -p 'require("./package.json").packageManager')"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - docs-bun-v1-{{ arch }}-{{ checksum "apps/docs/bun.lock" }}
            - docs-bun-v1-{{ arch }}-
      - run:
          name: Install dependencies
          working_directory: apps/docs
          command: bun install --frozen-lockfile
      - save_cache:
          key: docs-bun-v1-{{ arch }}-{{ checksum "apps/docs/bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - run:
          name: Build the site
          working_directory: apps/docs
          command: bun run build
      - run:
          # Replace the contents of gh-pages with the new build and add one
          # commit, so that the branch keeps a history of each release.
          # GITHUB_TOKEN comes from the github-releases context. The
          # credential helper passes it to git, so it never appears in a URL
          # or in the log. A separate git config file keeps the checkout
          # step's SSH settings from redirecting this HTTPS push.
          name: Publish to gh-pages
          working_directory: apps/docs
          command: |
            : "${GITHUB_TOKEN:?Add the github-releases context to this job.}"
            export GIT_CONFIG_GLOBAL="$HOME/.gitconfig-gh-pages"
            git config --global user.name "CircleCI"
            git config --global user.email "noreply@circleci.com"
            git config --global credential.helper \
              '!f() { echo username=x-access-token; echo "password=${GITHUB_TOKEN}"; }; f'
            repo="https://github.com/ddelvalfraire/cousins-lab-tools.git"
            git clone --quiet --depth 1 --branch gh-pages "$repo" /tmp/gh-pages
            find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R dist/. /tmp/gh-pages/
            cd /tmp/gh-pages
            git add --all
            if git diff --cached --quiet; then
              echo "gh-pages already matches this build."
              exit 0
            fi
            git commit --quiet -m "Publish the user manual from ${CIRCLE_TAG}" \
              -m "Built from ${CIRCLE_SHA1}."
            git push --quiet origin gh-pages

workflows:
  # --- legacy ---
  legacy:
    when: << pipeline.parameters.run-legacy >>
    jobs:
      - placeholder:
          name: legacy-placeholder
          section: legacy

  # --- desktop front end ---
  desktop-frontend:
    when: << pipeline.parameters.run-desktop-frontend >>
    jobs:
      - placeholder:
          name: desktop-frontend-placeholder
          section: desktop front-end

  # --- desktop Rust ---
  desktop-rust:
    when: << pipeline.parameters.run-desktop-rust >>
    jobs:
      - placeholder:
          name: desktop-rust-placeholder
          section: desktop Rust

  # --- docs ---
  docs:
    when: << pipeline.parameters.run-docs >>
    jobs:
      - docs-build

  # --- desktop release ---
  desktop-release:
    when: << pipeline.parameters.run-desktop-release >>
    jobs:
      - placeholder:
          name: desktop-release-placeholder
          section: desktop release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^desktop-v.*/

  # --- legacy release ---
  legacy-release:
    when: << pipeline.parameters.run-legacy-release >>
    jobs:
      - placeholder:
          name: legacy-release-placeholder
          section: legacy release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^legacy-v.*/

  # --- docs release ---
  docs-release:
    when: << pipeline.parameters.run-docs-release >>
    jobs:
      - docs-publish:
          context: github-releases
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^docs-v.*/

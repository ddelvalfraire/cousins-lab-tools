# Continuation config. config.yml sets the parameters below and continues the
# pipeline with this file.
#
# Each section owns one block under parameters, jobs, and workflows, in this
# order. Change only your own section's blocks, so that pull requests for
# different sections do not conflict. The placeholder job stands in until a
# section has its own jobs. When no parameter is true, no workflow runs.

version: 2.1

parameters:
  # --- legacy (apps/legacy) ---
  run-legacy:
    type: boolean
    default: false

  # --- desktop front end (apps/desktop, except src-tauri) ---
  run-desktop-frontend:
    type: boolean
    default: false

  # --- desktop Rust (apps/desktop/src-tauri, crates, Cargo.toml, Cargo.lock) ---
  run-desktop-rust:
    type: boolean
    default: false

  # --- docs (apps/docs) ---
  run-docs:
    type: boolean
    default: false

  # --- desktop release (desktop-v* tags) ---
  run-desktop-release:
    type: boolean
    default: false

  # --- legacy release (legacy-v* tags) ---
  run-legacy-release:
    type: boolean
    default: false

  # --- docs release (docs-v* tags) ---
  run-docs-release:
    type: boolean
    default: false

jobs:
  # --- shared ---
  placeholder:
    parameters:
      section:
        type: string
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "No << parameters.section >> checks yet."

  # --- legacy ---

  # --- desktop front end ---

  # --- desktop Rust ---
  desktop-rust-checks:
    docker:
      - image: cimg/rust:1.99.1
    resource_class: medium
    steps:
      - checkout
      # Linux system libraries for Tauri 2, from
      # https://v2.tauri.app/start/prerequisites/. Later jobs on a cimg image
      # can reuse this step with `- *install-tauri-linux-deps`.
      - &install-tauri-linux-deps
        run:
          name: Install Tauri system libraries
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential \
              file \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              libxdo-dev
      - run:
          name: Install rustfmt and Clippy
          command: rustup component add rustfmt clippy
      - restore_cache:
          keys:
            - cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v1-{{ arch }}-
      # Debug builds of the Tauri app do not embed the front end (tauri.conf.json
      # sets devUrl), so these checks do not need apps/desktop/dist.
      - run:
          name: rustfmt
          command: cargo fmt --all --check
      - run:
          name: Clippy
          command: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run:
          name: Tests
          command: cargo test --workspace --locked
      - save_cache:
          key: cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - target

  # --- docs ---

  # --- desktop release ---

  # --- legacy release ---

  # --- docs release ---

workflows:
  # --- legacy ---
  legacy:
    when: << pipeline.parameters.run-legacy >>
    jobs:
      - placeholder:
          name: legacy-placeholder
          section: legacy

  # --- desktop front end ---
  desktop-frontend:
    when: << pipeline.parameters.run-desktop-frontend >>
    jobs:
      - placeholder:
          name: desktop-frontend-placeholder
          section: desktop front-end

  # --- desktop Rust ---
  desktop-rust:
    when: << pipeline.parameters.run-desktop-rust >>
    jobs:
      - desktop-rust-checks

  # --- docs ---
  docs:
    when: << pipeline.parameters.run-docs >>
    jobs:
      - placeholder:
          name: docs-placeholder
          section: docs

  # --- desktop release ---
  desktop-release:
    when: << pipeline.parameters.run-desktop-release >>
    jobs:
      - placeholder:
          name: desktop-release-placeholder
          section: desktop release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^desktop-v.*/

  # --- legacy release ---
  legacy-release:
    when: << pipeline.parameters.run-legacy-release >>
    jobs:
      - placeholder:
          name: legacy-release-placeholder
          section: legacy release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^legacy-v.*/

  # --- docs release ---
  docs-release:
    when: << pipeline.parameters.run-docs-release >>
    jobs:
      - placeholder:
          name: docs-release-placeholder
          section: docs release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^docs-v.*/

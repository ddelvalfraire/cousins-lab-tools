<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cousins Lab · acquisition</title>
<link rel="icon" type="image/png" href="assets/cousins-logo.png">
<link rel="stylesheet" href="styles.css">
<script>
  (() => {
    const mode = localStorage.getItem("cousins-appearance") || "system";
    const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
</head>
<body>
<nav class="sidebar" aria-label="Main navigation" id="sidebar"></nav>
<main id="page" tabindex="-1"></main>
<dialog id="dialog"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="assets/vendor/echarts.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

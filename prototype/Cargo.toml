[workspace]
resolver = "3"
members = ["core", "desktop"]
default-members = ["core"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

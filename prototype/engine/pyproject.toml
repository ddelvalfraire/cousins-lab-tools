[project]
name = "cousinslab"
version = "0.1.0"
description = "Acquisition engine prototype for the Cousins Lab: templates, instrument adapters, sessions, alignment"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "pyarrow>=26",
    "pyyaml>=6",
    "openpyxl>=3.1",
    # DuckDB needs pytz to return TIMESTAMPTZ values to Python.
    "pytz",
]

[project.scripts]
cousinslab = "cousinslab.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    # The legacy parity test imports module1's read_from_ezview unchanged, which needs these.
    "pandas",
    "numpy",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cousinslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
